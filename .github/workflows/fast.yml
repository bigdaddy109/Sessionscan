# Fast scrape: YouTube videos + Shorts + X tweets only (skip jobs/forum).
# Trigger: workflow_dispatch only (manual or external cron / CF Worker).
# Full jobs/forum refresh stays on daily.yml.
#
# CF Worker / external dispatch (every ~2h), workflow file name + API:
#   POST https://api.github.com/repos/bigdaddy109/Sessionscan/actions/workflows/fast.yml/dispatches
#   Authorization: Bearer <PAT with actions:write>
#   Accept: application/vnd.github+json
#   Body: {"ref":"main","inputs":{"source":"cf-worker"}}
#
# Or CLI: gh workflow run "fast scrape" --ref main -f source=cf-worker
name: fast scrape

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who triggered this run (e.g. cf-worker, manual)"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write

concurrency:
  # Share the daily scrape group so fast + full never race on the data branch.
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Checkout data (JSON)
        uses: actions/checkout@v4
        with:
          ref: data
          path: payload

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Overlay JSON onto the code tree
        run: |
          mkdir -p app/data app/public/data
          if [ -d payload/data ]; then
            cp -a payload/data/. app/data/
          fi
          if [ -f payload/public/data/site.json ]; then
            cp -a payload/public/data/site.json app/public/data/site.json
          fi

      - name: Install scraper
        working-directory: app
        run: pip install -r requirements.txt

      - name: Run fast scraper (videos + shorts + tweets)
        working-directory: app
        env:
          FAST_SCRAPE_SOURCE: ${{ inputs.source }}
        run: |
          echo "fast scrape source=${FAST_SCRAPE_SOURCE:-manual}"
          python scraper.py --fast

      - name: Merge JSON for the static hub
        working-directory: app
        run: python build_site.py

      - name: Commit refreshed data to data branch only
        run: |
          mkdir -p payload/data payload/public/data
          cp -a app/data/. payload/data/
          cp -a app/public/data/site.json payload/public/data/site.json
          cd payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data/site.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "fast data update $(date -u +%F)"
            git push origin HEAD:data
          fi
