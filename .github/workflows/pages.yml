name: pages
on:
  push:
    # `data` is listed for intent, but a push only runs a workflow that exists on THAT
    # branch. The data branch is JSON-only, so this never fires. Daily updates are
    # picked up via workflow_run instead (evaluated from the default branch).
    branches: [main, data]
  workflow_dispatch:
  workflow_run:
    workflows: ["daily scrape"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Queue the next deploy. Cancelling an in-flight Pages job leaves github.io stale.
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          # Push/dispatch on main (or workflow_run) → that SHA.
          # Push to data (only if this file exists there) → latest main.
          ref: ${{ github.ref == 'refs/heads/data' && 'main' || github.sha }}
          path: app

      - name: Checkout data (JSON)
        uses: actions/checkout@v4
        with:
          ref: data
          path: payload

      - name: Overlay scrape JSON
        run: |
          mkdir -p app/data app/public/data
          if [ -d payload/data ]; then
            cp -a payload/data/. app/data/
          fi
          if [ -f payload/public/data/site.json ]; then
            cp -a payload/public/data/site.json app/public/data/site.json
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - working-directory: app
        run: npm install

      - working-directory: app
        run: npm run build

      - name: Require crawler-visible weekly title
        working-directory: app
        run: |
          grep -E 'gtabase.com|GTA Online Weekly' dist/index.html
          grep 'id="crawlJobs"' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
