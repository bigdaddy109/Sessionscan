name: pages
on:
  push:
    branches: [main, data]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          # Push to data → latest main. Push to main → this SHA so the shell cannot lag.
          ref: ${{ github.ref == 'refs/heads/data' && 'main' || github.sha }}
          path: app

      - name: Checkout data (JSON)
        uses: actions/checkout@v4
        with:
          ref: data
          path: payload

      - name: Overlay scrape JSON
        run: |
          mkdir -p app/data app/public/data
          if [ -d payload/data ]; then
            cp -a payload/data/. app/data/
          fi
          if [ -f payload/public/data/site.json ]; then
            cp -a payload/public/data/site.json app/public/data/site.json
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - working-directory: app
        run: npm install

      - working-directory: app
        run: npm run build

      - name: Require crawler-visible weekly title
        working-directory: app
        run: |
          grep -E 'gtabase.com|GTA Online Weekly' dist/index.html
          grep 'id="crawlJobs"' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
